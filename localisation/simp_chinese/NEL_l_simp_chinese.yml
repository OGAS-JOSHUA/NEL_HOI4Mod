l_simp_chinese:
 CHI_Collapse_of_Prosperity: "繁荣之破灭"
 CHI_Collapse_of_Prosperity_desc: "我们曾许下承诺，承诺复兴，发展，幸福与和谐。\n我们曾做到过，实现过这些诺言；那时一切是如此美好，九州四海在白虹之下歌舞升平，繁荣不是一个词，而是人人皆在其中的真实生活。\n随后，危机爆发了。\n对于其他东亚国家而言，那场经济危机的滔天巨浪不过只是轰垮了它们的经济。但对于当时的中国而言，经济就是一切。\n于是，潮水散去后，民众恸哭着，哀叹着，而我们曾坚实无比的统治，也开始逐步崩塌。时至今日，虽说在政府的抢救与地方的维护下，我们于总统府高堂之上可以装出一副20余年来无事发生的面孔，但在背地里，全国上下所有人都知晓：\n§R八十年代的繁华已然破灭，再无回归之可能。"